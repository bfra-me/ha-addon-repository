name: Bug report
description: Report a reproducible problem with an add-on
title: '[Bug]: '
body:
  - type: input
    id: addon
    attributes:
      label: Add-on name and version
      description: Include the add-on name and the version shown in its config.
      placeholder: Example add-on 1.2.6
    validations:
      required: true
  - type: input
    id: home_assistant
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.0
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      description: For example, amd64 or aarch64.
      placeholder: amd64
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Home Assistant OS
        - Home Assistant Supervised
        - Home Assistant Container
        - Home Assistant Core
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs. Remove secrets, tokens, and personal data.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Start ...
        3. Observe ...
    validations:
      required: true
