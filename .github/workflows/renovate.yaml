---
# Renovate this repository if Renovate-specific tasks are checked or if dispatched.
name: Renovate

'on':
  issues:
    types: [edited]
  pull_request:
    types: [edited]
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      log-level:
        description: Log level for Renovate
        required: false
        type: string
        default: debug
      print-config:
        description: Log the fully-resolved Renovate config for each repository, plus fully-resolved presets.
        required: false
        type: boolean
        default: false
  # Runs a full Renovate pass once Main succeeds on the default branch. The
  # called workflow grants only contents: read, checks out no ref (so it gets
  # the default branch rather than a pull request head), downloads no artifacts
  # from the triggering run, and uses event body text only inside contains()
  # predicates — so the privilege escalation this audit exists to catch has no
  # path here. Re-check when the pinned SHA below changes.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Main]
    branches: [main]
    types: [completed]

jobs:
  renovate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Renovate
    permissions:
      contents: read
    secrets:
      APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
      APPLICATION_PRIVATE_KEY: ${{ secrets.APPLICATION_PRIVATE_KEY }}
    uses: bfra-me/.github/.github/workflows/renovate.yaml@5310cfc4af25a89c95e1ac64bf7e9e5503bde9a1 # v4.26.0
    with:
      log-level: ${{ inputs.log-level || (github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch) && 'debug' || 'info' }}
      print-config: ${{ inputs.print-config || false }}
