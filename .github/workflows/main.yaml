---
name: Main

'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Prepare
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
      scripts_changed: ${{ steps.filter.outputs.scripts_changed }}
      build_matrix: ${{ steps.build_matrix.outputs.matrix }}
      manifest_matrix: ${{ steps.build_matrix.outputs.manifest_matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find add-on directories
        id: addons
        env:
          MONITORED_FILES: 'apparmor.txt config.json config.yaml config.yml Dockerfile rootfs/**'
        run: |
          declare -a addons
          declare -a addons_list
          declare -a filters
          declare -a monitored_files

          read -r -a monitored_files <<< "$MONITORED_FILES"
          while IFS= read -r addon; do
            addons+=("${addon}");
            addons_list+=("\"${addon}\",");
            for file in "${monitored_files[@]}"; do
              filters+=("\"${addon}/${file}\",");
            done
          done < <(find ./ -maxdepth 2 \( -name config.json -o -name config.yaml -o -name config.yml \) -print | cut -d "/" -f2 | sort -u)

          json_list=$(printf '%s' "${addons_list[@]}")
          filter_list=$(printf '%s' "${filters[@]}")
          json_list=${json_list%,}
          filter_list=${filter_list%,}

          echo "Found addons: ${addons[*]}"
          echo "Found addons (JSON): [${json_list}]"
          {
            echo "addons=${addons[*]}"
            echo "addons_list=[${json_list}]"
            echo "filters=[${filter_list}]"
          } >> "$GITHUB_OUTPUT"

      - name: Get changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changed: ${{ steps.addons.outputs.filters }}
            scripts_changed:
              - '.github/scripts/**'
          list-files: json

      - name: Get changed add-ons
        id: changed_addons
        env:
          ADDONS: ${{ steps.addons.outputs.addons }}
          CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}
        run: |
          declare -A seen=()
          declare -a addons=()
          declare -a changed_addons=()

          read -r -a addons <<< "$ADDONS"
          while IFS= read -r file; do
            addon=${file%%/*}
            for candidate in "${addons[@]+"${addons[@]}"}"; do
              if [[ "$addon" == "$candidate" ]]; then
                if [[ -z ${seen["$candidate"]+_} ]]; then
                  seen["$candidate"]=1
                  changed_addons+=("$candidate")
                fi
                break
              fi
            done
          done < <(jq -r '.[]' <<< "$CHANGED_FILES")

          changed=$(jq -cn --args '$ARGS.positional' "${changed_addons[@]+"${changed_addons[@]}"}")
          if [[ "$changed" != '[]' ]]; then
            echo "Changed add-ons: $changed";
            echo "changed=true" >> "$GITHUB_OUTPUT";
          else
            echo "No addon had changes that require linting and building";
            echo "changed=false" >> "$GITHUB_OUTPUT";
          fi
          echo "addons=$changed" >> "$GITHUB_OUTPUT"

      - name: Prepare build matrices
        id: build_matrix
        env:
          CHANGED_ADDONS: ${{ steps.changed_addons.outputs.addons }}
        run: |
          build_matrix='{"include":[]}'
          manifest_matrix='{"include":[]}'

          while IFS= read -r addon; do
            architectures=[]
            image=""
            version=""

            for ext in yaml yml json; do
              config="$addon/config.${ext}"
              if [[ -f "$config" ]]; then
                architectures=$(yq e -N -M '.arch' -o=json -I=0 "$config")
                image=$(yq e -N -M '.image' "$config")
                version=$(yq e -N -M '.version' "$config")
                break
              fi
            done

            if [[ -z "$image" || "$image" == "null" ]]; then
              echo "No image configured for $addon" >&2
              exit 1
            fi

            registry_prefix="${image%/*}"
            image_name="${image##*/}"
            manifest_matrix=$(jq -c \
              --arg addon "$addon" \
              --arg image_name "$image_name" \
              --arg registry_prefix "$registry_prefix" \
              --arg architectures "$architectures" \
              --arg version "$version" \
              '.include += [{addon: $addon, architectures: $architectures, image_name: $image_name, registry_prefix: $registry_prefix, version: $version}]' \
              <<< "$manifest_matrix")

            while IFS= read -r arch; do
              case "$arch" in
                amd64) os="ubuntu-24.04" ;;
                aarch64) os="ubuntu-24.04-arm" ;;
                *)
                  echo "::error::Unsupported architecture: $arch. Supported values: amd64, aarch64"
                  exit 1
                  ;;
              esac

              build_matrix=$(jq -c \
                --arg addon "$addon" \
                --arg arch "$arch" \
                --arg os "$os" \
                --arg image "${registry_prefix}/${arch}-${image_name}" \
                --arg version "$version" \
                '.include += [{addon: $addon, arch: $arch, os: $os, image: $image, version: $version}]' \
                <<< "$build_matrix")
            done < <(jq -r '.[]' <<< "$architectures")
          done < <(jq -r '.[]' <<< "$CHANGED_ADDONS")

          {
            echo "matrix=$build_matrix"
            echo "manifest_matrix=$manifest_matrix"
          } >> "$GITHUB_OUTPUT"

  lint-addon:
    if: needs.prepare.outputs.changed == 'true'
    name: Lint add-on ${{ matrix.addon }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: ${{ fromJson(needs.prepare.outputs.changed_addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🚀 Run Home Assistant Add-on Lint
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: './${{ matrix.addon }}'

  lint-prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: 💅🏽 Run Prettier
        uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        env:
          PRETTIER_VERSION: 3.9.6 # renovate: datasource=npm depName=prettier
        with:
          dry: true
          only_changed: true
          prettier_options: --check .
          prettier_version: ${{ env.PRETTIER_VERSION }}

  release-integrity:
    name: Release integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Validate release metadata
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: .github/scripts/release-integrity.sh

  release-integrity-tests:
    if: needs.prepare.outputs.scripts_changed == 'true'
    name: Release integrity tests
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Run release integrity regression suite
        run: bash .github/scripts/release-integrity-test.sh

  repository-metadata:
    name: Repository metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Validate repository metadata
        run: .github/scripts/repository-metadata.sh

  lint:
    name: Lint
    if: always()
    needs: [prepare, lint-addon, lint-prettier, release-integrity, release-integrity-tests, repository-metadata]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Complete
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PREPARE_CHANGED: ${{ needs.prepare.outputs.changed }}
          LINT_ADDON_RESULT: ${{ needs.lint-addon.result }}
          LINT_PRETTIER_RESULT: ${{ needs.lint-prettier.result }}
          RELEASE_INTEGRITY_RESULT: ${{ needs.release-integrity.result }}
          PREPARE_SCRIPTS_CHANGED: ${{ needs.prepare.outputs.scripts_changed }}
          RELEASE_INTEGRITY_TESTS_RESULT: ${{ needs.release-integrity-tests.result }}
          REPOSITORY_METADATA_RESULT: ${{ needs.repository-metadata.result }}
        run: |
          if [[ "$PREPARE_RESULT" != "success" ]]; then
            echo "Prepare failed: $PREPARE_RESULT" >&2
            exit 1
          fi
          if [[ "$LINT_PRETTIER_RESULT" != "success" ]]; then
            echo "Prettier lint failed: $LINT_PRETTIER_RESULT" >&2
            exit 1
          fi
          if [[ "$RELEASE_INTEGRITY_RESULT" != "success" ]]; then
            echo "Release integrity failed: $RELEASE_INTEGRITY_RESULT" >&2
            exit 1
          fi
          if [[ "$LINT_ADDON_RESULT" == "skipped" ]]; then
            if [[ "$PREPARE_CHANGED" != "false" ]]; then
              echo "Add-on lint was skipped despite Prepare reporting changed add-ons" >&2
              exit 1
            fi
          elif [[ "$LINT_ADDON_RESULT" != "success" ]]; then
            echo "Add-on lint failed: $LINT_ADDON_RESULT" >&2
            exit 1
          fi
          if [[ "$RELEASE_INTEGRITY_TESTS_RESULT" == "skipped" ]]; then
            if [[ "$PREPARE_SCRIPTS_CHANGED" != "false" ]]; then
              echo "Release integrity tests were skipped despite Prepare reporting script changes" >&2
              exit 1
            fi
          elif [[ "$RELEASE_INTEGRITY_TESTS_RESULT" != "success" ]]; then
            echo "Release integrity tests failed: $RELEASE_INTEGRITY_TESTS_RESULT" >&2
            exit 1
          fi
          if [[ "$REPOSITORY_METADATA_RESULT" != "success" ]]; then
            echo "Repository metadata validation failed: $REPOSITORY_METADATA_RESULT" >&2
            exit 1
          fi
          echo "Lint completed"

  build-addon:
    needs: [prepare]
    if: >-
      needs.prepare.outputs.changed == 'true' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        )
      )
    name: Build add-on ${{ matrix.addon }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build add-on image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: './${{ matrix.addon }}'
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: 'true'
          image: ${{ matrix.image }}
          image-tags: |
            ${{ matrix.version }}
            latest
          push: 'false'
          version: ${{ matrix.version }}

  publish-addon:
    needs: [prepare]
    if: >-
      needs.prepare.outputs.changed == 'true' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Publish add-on ${{ matrix.addon }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish add-on image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: './${{ matrix.addon }}'
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: 'true'
          image: ${{ matrix.image }}
          image-tags: |
            ${{ matrix.version }}
            latest
          push: 'true'
          version: ${{ matrix.version }}

  publish-manifest:
    needs: [prepare, publish-addon]
    if: >-
      needs.prepare.outputs.changed == 'true' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Publish add-on manifest ${{ matrix.addon }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.manifest_matrix) }}

    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ matrix.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: 'true'
          image-name: ${{ matrix.image_name }}
          image-tags: ${{ matrix.version }}
          registry-prefix: ${{ matrix.registry_prefix }}

      - name: Verify published manifest platforms
        env:
          ARCHITECTURES: ${{ matrix.architectures }}
          IMAGE_NAME: ${{ matrix.image_name }}
          REGISTRY_PREFIX: ${{ matrix.registry_prefix }}
          VERSION: ${{ matrix.version }}
        run: |
          image_ref="${REGISTRY_PREFIX}/${IMAGE_NAME}:${VERSION}"
          manifest_file="$(mktemp)"
          trap 'rm -f "$manifest_file"' EXIT

          docker buildx imagetools inspect --raw "$image_ref" > "$manifest_file"

          expected_platforms=$(jq -c '
            map(
              if . == "amd64" then {os: "linux", architecture: "amd64"}
              elif . == "aarch64" then {os: "linux", architecture: "arm64"}
              else error("Unsupported architecture: " + .)
              end
            ) | sort_by(.architecture)
          ' <<< "$ARCHITECTURES")
          actual_platforms=$(jq -c '
            [.manifests[]
              | select(.platform.os != "unknown" and .platform.architecture != "unknown")
              | {os: .platform.os, architecture: .platform.architecture}
            ] | sort_by(.architecture)
          ' "$manifest_file")

          if [[ "$actual_platforms" != "$expected_platforms" ]]; then
            echo "Expected platforms: $expected_platforms" >&2
            echo "Published platforms: $actual_platforms" >&2
            exit 1
          fi

          echo "Published manifest has exactly the configured platforms: $actual_platforms"

  build:
    name: Build
    if: always()
    needs: [prepare, build-addon, publish-addon, publish-manifest]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Complete
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PREPARE_CHANGED: ${{ needs.prepare.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILD_ADDON_RESULT: ${{ needs.build-addon.result }}
          PUBLISH_ADDON_RESULT: ${{ needs.publish-addon.result }}
          PUBLISH_MANIFEST_RESULT: ${{ needs.publish-manifest.result }}
        run: |
          if [[ "$PREPARE_RESULT" != "success" ]]; then
            echo "Prepare failed: $PREPARE_RESULT" >&2
            exit 1
          fi

          require_status() {
            local job=$1
            local actual=$2
            local expected=$3
            if [[ "$actual" != "$expected" ]]; then
              echo "$job must be $expected, but was $actual" >&2
              exit 1
            fi
          }

          if [[ "$PREPARE_CHANGED" != "true" ]]; then
            require_status "build-addon" "$BUILD_ADDON_RESULT" "skipped"
            require_status "publish-addon" "$PUBLISH_ADDON_RESULT" "skipped"
            require_status "publish-manifest" "$PUBLISH_MANIFEST_RESULT" "skipped"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            require_status "build-addon" "$BUILD_ADDON_RESULT" "success"
            require_status "publish-addon" "$PUBLISH_ADDON_RESULT" "skipped"
            require_status "publish-manifest" "$PUBLISH_MANIFEST_RESULT" "skipped"
          elif [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$WORKFLOW_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              require_status "build-addon" "$BUILD_ADDON_RESULT" "skipped"
              require_status "publish-addon" "$PUBLISH_ADDON_RESULT" "success"
              require_status "publish-manifest" "$PUBLISH_MANIFEST_RESULT" "success"
            else
              require_status "build-addon" "$BUILD_ADDON_RESULT" "success"
              require_status "publish-addon" "$PUBLISH_ADDON_RESULT" "skipped"
              require_status "publish-manifest" "$PUBLISH_MANIFEST_RESULT" "skipped"
            fi
          else
            echo "Unsupported workflow event: $EVENT_NAME" >&2
            exit 1
          fi
          echo "Build completed"
