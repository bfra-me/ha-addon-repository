---
name: Main

'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Prepare
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find add-on directories
        id: addons
        env:
          MONITORED_FILES: 'apparmor.txt build.yaml config.yaml Dockerfile rootfs/**'
        run: |
          declare -a addons
          declare -a addons_list
          declare -a filters

          for addon in $(find ./ -maxdepth 2 -name config.json -o -name config.yaml -o -name config.yml | cut -d "/" -f2 | sort -u); do
            addons+=("${addon}");
            addons_list+=("\"${addon}\",");
            for file in $MONITORED_FILES; do
              filters+=("\"${addon}/${file}\",");
            done
          done

          json_list=$(echo ${addons_list[@]} | rev | cut -c 2- | rev)
          filter_list=$(echo ${filters[@]} | rev | cut -c 2- | rev)

          echo "Found addons: ${addons[@]}"
          echo "Found addons (JSON): [${json_list}]"
          echo "addons=${addons[@]}" >> "$GITHUB_OUTPUT"
          echo "addons_list=[${json_list}]" >> "$GITHUB_OUTPUT"
          echo "filters=[${filter_list}]" >> "$GITHUB_OUTPUT"

      - name: Get changed files
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            changed: ${{ steps.addons.outputs.filters }}
          list-files: json

      - name: Get changed add-ons
        id: changed_addons
        env:
          ADDONS: ${{ steps.addons.outputs.addons }}
          CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}
        run: |
          declare -A seen=()
          declare -a addons=()
          declare -a changed_addons=()

          read -r -a addons <<< "$ADDONS"
          while IFS= read -r file; do
            addon=${file%%/*}
            for candidate in "${addons[@]+"${addons[@]}"}"; do
              if [[ "$addon" == "$candidate" ]]; then
                if [[ -z ${seen["$candidate"]+_} ]]; then
                  seen["$candidate"]=1
                  changed_addons+=("$candidate")
                fi
                break
              fi
            done
          done < <(jq -r '.[]' <<< "$CHANGED_FILES")

          changed=$(jq -cn --args '$ARGS.positional' "${changed_addons[@]+"${changed_addons[@]}"}")
          if [[ "$changed" != '[]' ]]; then
            echo "Changed add-ons: $changed";
            echo "changed=true" >> "$GITHUB_OUTPUT";
            echo "addons=$changed" >> "$GITHUB_OUTPUT";
          else
            echo "No addon had changes that require linting and building";
          fi

  lint-addon:
    if: needs.prepare.outputs.changed == 'true'
    name: Lint add-on ${{ matrix.addon }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: ${{ fromJson(needs.prepare.outputs.changed_addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🚀 Run Home Assistant Add-on Lint
        uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb # v2.21.0
        with:
          path: './${{ matrix.addon }}'

  lint-prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: 💅🏽 Run Prettier
        uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        env:
          PRETTIER_VERSION: 3.8.3 # renovate: datasource=npm depName=prettier
        with:
          dry: true
          only_changed: true
          prettier_options: --check .
          prettier_version: ${{ env.PRETTIER_VERSION }}

  lint:
    name: Lint
    needs: [lint-addon, lint-prettier]
    runs-on: ubuntu-latest
    steps:
      - name: Complete
        run: echo "Lint completed"

  build-addon:
    needs: [prepare]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.changed == 'true'
    name: Build add-on ${{ matrix.addon }}-${{ matrix.arch }}
    env:
      BUILD_ARGS: '--test'
    permissions:
      contents: read
      id-token: write
      packages: write

    strategy:
      matrix:
        addon: ${{ fromJson(needs.prepare.outputs.changed_addons) }}
        arch: ['aarch64', 'amd64']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get metadata
        id: metadata
        env:
          ADDON: ${{ matrix.addon }}
        run: |
          archs=[]
          image=""
          version=""

          for ext in json yml yaml; do
            if [[ -f "$ADDON/build.${ext}" ]]; then
              archs=$(yq e -N -M '.build_from | keys' -o=json -I=0 "$ADDON/build.${ext}")
              break
            elif [[ -f "$ADDON/config.${ext}" ]]; then
              archs=$(yq e -N -M '.arch' -o=json -I=0 "$ADDON/config.${ext}")
              break
            fi
          done

          for ext in json yml yaml; do
            if [[ -f "$ADDON/config.${ext}" ]]; then
              image=$(yq e -N -M '.image' -o=json -I=0 "$ADDON/config.${ext}")
              version=$(yq e -N -M '.version' -o=json -I=0 "$ADDON/config.${ext}")
              break
            fi
          done

          echo "Architectures: $archs"
          echo "Image: $image"
          echo "Version: $version"

          echo "architectures=$archs" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check if add-on is being built for architecture
        id: check
        env:
          ADDON: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
          ARCHITECTURES: ${{ steps.metadata.outputs.architectures }}
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          if jq -e --arg a "$ARCH" 'index($a)' <<< "$ARCHITECTURES" >/dev/null; then
            echo "build_arch=true" >> "$GITHUB_OUTPUT";
            echo "image=$(printf '%s\n' "$IMAGE" | cut -d'/' -f3)" >> "$GITHUB_OUTPUT";
          else
            echo "$ARCH is not a valid arch for $ADDON, skipping build";
          fi

      - name: Set build arguments
        if: >-
          steps.check.outputs.build_arch == 'true' &&
          (
            (github.event_name == 'push' && github.head_ref == '') ||
            github.event_name == 'workflow_dispatch'
          )
        run: echo "BUILD_ARGS=" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        if: env.BUILD_ARGS != '--test'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.addon }} add-on
        if: steps.check.outputs.build_arch == 'true'
        uses: home-assistant/builder@2026.03.2
        with:
          args: |
            ${{ env.BUILD_ARGS }} \
            --${{ matrix.arch }} \
            --target /data/${{ matrix.addon }} \
            --image "${{ steps.check.outputs.image }}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon \
            --cosign

  build:
    name: Build
    needs: [build-addon]
    runs-on: ubuntu-latest
    steps:
      - name: Complete
        run: echo "Build completed"
